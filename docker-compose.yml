name: jxkr2026-platform-backend

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salgil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salgil}
      POSTGRES_DB: ${POSTGRES_DB:-salgil}
      # 한국어 정렬을 위해 C.UTF-8 을 명시한다.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 로컬에서 psql 로 붙기 위한 것. 운영에서는 이 줄을 지운다.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salgil} -d ${POSTGRES_DB:-salgil}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SALGIL_ENV: ${SALGIL_ENV:-local}
      SALGIL_LOG_LEVEL: ${SALGIL_LOG_LEVEL:-INFO}
      SALGIL_LOG_JSON: ${SALGIL_LOG_JSON:-true}

      SALGIL_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-salgil}:${POSTGRES_PASSWORD:-salgil}@db:5432/${POSTGRES_DB:-salgil}

      # ── 공공데이터 상류 (읽기 전용) ──────────────────────────────────────
      SALGIL_GBSAFE_BASE_URL: ${SALGIL_GBSAFE_BASE_URL:-https://datainfra.salgil.gyeongbuk.kr}
      SALGIL_GBSAFE_TIMEOUT_S: ${SALGIL_GBSAFE_TIMEOUT_S:-30}
      SALGIL_GBSAFE_CONTEXT_TIMEOUT_S: ${SALGIL_GBSAFE_CONTEXT_TIMEOUT_S:-120}

      # ── ML 추론 서버 (Lambda H100 · Triton) ─────────────────────────────
      # 여기 URL 과 토큰만 채우면 붙는다. 비워 두면 stub 으로 돈다.
      SALGIL_MLENGINE_MODE: ${SALGIL_MLENGINE_MODE:-stub}
      SALGIL_MLENGINE_BASE_URL: ${SALGIL_MLENGINE_BASE_URL:-http://127.0.0.1:8900}
      SALGIL_MLENGINE_API_KEY: ${SALGIL_MLENGINE_API_KEY:-}
      SALGIL_MLENGINE_TIMEOUT_S: ${SALGIL_MLENGINE_TIMEOUT_S:-60}

      # ── 인증 ─────────────────────────────────────────────────────────────
      SALGIL_API_KEYS: ${SALGIL_API_KEYS:-dev-operator:operator,dev-approver:approver,dev-field:field}

      SALGIL_CORS_ORIGINS: ${SALGIL_CORS_ORIGINS:-http://localhost:8080,http://localhost:8081,http://localhost:8082,http://localhost:5173,http://localhost:5174,http://localhost:5175}

      # ── 도로망 ───────────────────────────────────────────────────────────
      # 셋 중 하나를 고른다.
      #
      #  1) 아무것도 안 한다 → 경로 계산만 거절되고 나머지는 정상 동작
      #  2) bbox 만 준다     → 첫 기동에 받아 volume 에 둔다 (이미지는 깨끗)
      #  3) 파일을 마운트한다 → 네트워크 없이 즉시 (아래 volumes 참고)
      #
      # 이미지에 굽는 방법도 있다 (Dockerfile 의 ROAD_NETWORK_BBOX). 다만 그러면
      # **이미지가 ODbL 파생물이 되어** 레지스트리에 올리는 순간 배포가 된다.
      # 비워 두면 이미지 기본값(/data/road/roads.geojson)을 쓴다.
      SALGIL_ROAD_NETWORK_PATH: ${SALGIL_ROAD_NETWORK_PATH:-/data/road/roads.geojson}
      SALGIL_ROAD_NETWORK_BBOX: ${SALGIL_ROAD_NETWORK_BBOX:-}

      SALGIL_RUN_MIGRATIONS: ${SALGIL_RUN_MIGRATIONS:-1}
      SALGIL_RUN_SEED: ${SALGIL_RUN_SEED:-1}
    volumes:
      # 기본은 이름 있는 볼륨이다 — bbox 를 주면 첫 기동에 받아 여기 남고,
      # 이미지에는 OSM 데이터가 들어가지 않는다.
      # 미리 만든 파일을 쓰려면 ROAD_NETWORK_DIR 로 호스트 디렉터리를 지정한다:
      #   ROAD_NETWORK_DIR=./data/local docker compose up -d
      - ${ROAD_NETWORK_DIR:-roaddata}:/data/road
    ports:
      - "${API_PORT:-8000}:8000"

volumes:
  pgdata:
  roaddata:
