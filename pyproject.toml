[project]
name = "jxkr2026-platform-backend"
version = "0.1.0"
description = "SALGIL platform backend — 경북 재난대피 운영 상태를 소유하고, 공공데이터·예측모델을 출처와 함께 프론트엔드에 전달한다"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.28",
    "structlog>=24.4",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.14",
    "aiosqlite>=0.20",
    "respx>=0.22",
]

[project.scripts]
salgil = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = [
    "B008",    # FastAPI 의 Depends() 기본값은 프레임워크 관용이다
    "RUF001",  # 격자 형상을 "16×16" 으로 적는다. 곱셈기호는 오타가 아니라 의도다
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# HTTP 클라이언트 래퍼의 timeout 은 httpx 로 그대로 넘기는 인자다 —
# asyncio.timeout 을 쓰라는 규칙이 여기서는 맞지 않는다.
"app/clients/*.py" = ["ASYNC109"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = "alembic/"

[tool.coverage.run]
source = ["app"]
omit = ["app/cli.py"]
